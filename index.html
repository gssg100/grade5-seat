<!DOCTYPE html>
<html lang="ko">
<head>
<title>5학년 자리바꾸기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%AA%91%3C/text%3E%3C/svg%3E">
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --ink: #1c2230; --muted: #6a7385; --line: #e2e6ee; --soft: #f7f8fb;
    --pri: #2f6fed; --pri-soft: #e8f0fe; --pri-ink: #1d4fc4;
    --ok: #16924a; --ok-soft: #e6f6ec; --warn: #b45309; --warn-soft: #fff4e2; --bad: #c62828; --bad-soft: #fdecec;
    --m: #e8f1ff; --m-line: #9ebcf3; --f: #fdeef2; --f-line: #eeaabb; --off: #eceef2;
    --c1: #2f6fed; --c2: #0f9d8a; --me: #ffd54a;
    --radius: 14px; --shadow: 0 1px 2px rgba(20,30,60,.06), 0 4px 14px rgba(20,30,60,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 15px/1.55 -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 16px 16px 120px; }
  .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 4px 0 14px; }
  .top h1 { font-size: 20px; margin: 0; }
  .top .sp { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--pri-soft); color: var(--pri-ink); white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.gray { background: var(--off); color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card h2 { font-size: 17px; margin: 0 0 10px; }
  .card h3 { font-size: 15px; margin: 14px 0 8px; }
  .muted { color: var(--muted); } .small { font-size: 13px; } .center { text-align: center; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
  .btn { border: 1px solid var(--line); background: var(--card); padding: 9px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; }
  .btn:hover { border-color: #c8cfdc; }
  .btn.pri { background: var(--pri); border-color: var(--pri); color: #fff; }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn.bad { background: var(--card); border-color: #f0b8b8; color: var(--bad); }
  .btn.big { padding: 14px 22px; font-size: 17px; border-radius: 12px; }
  .btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.link { border: none; background: none; color: var(--pri-ink); padding: 4px 6px; }
  input[type=text], input[type=number], input[type=password], select {
    border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 11px; background: #fff; width: 100%; }
  input:focus, select:focus { outline: none; border-color: var(--pri); box-shadow: 0 0 0 3px var(--pri-soft); }
  label.f { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 5px; font-weight: 600; }
  .notice { border-radius: 12px; padding: 11px 14px; font-size: 14px; margin-bottom: 12px; }
  .notice.info { background: var(--pri-soft); color: var(--pri-ink); }
  .notice.warn { background: var(--warn-soft); color: var(--warn); }
  .notice.bad { background: var(--bad-soft); color: var(--bad); }
  .notice.ok { background: var(--ok-soft); color: var(--ok); }
  .admin-banner { position: sticky; top: 0; z-index: 30; background: #b91c1c; color: #fff; text-align: center; font-weight: 700; padding: 8px 12px; font-size: 14px; }

  /* 반 고르기 */
  .classes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 640px) { .classes { grid-template-columns: repeat(3, 1fr); } }
  .cls { border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 16px 8px; text-align: center; cursor: pointer; box-shadow: var(--shadow); }
  .cls b { display: block; font-size: 20px; }
  .cls span { font-size: 12.5px; color: var(--muted); }
  .cls.on { border-color: var(--pri); }
  .cls:disabled { cursor: default; opacity: .55; box-shadow: none; }

  /* 번호 고르기 */
  .nums { display: grid; grid-template-columns: repeat(10, 1fr); gap: 7px; }
  @media (max-width: 640px) { .nums { grid-template-columns: repeat(6, 1fr); } }
  .num { border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 9px 0 7px; cursor: pointer; text-align: center; font-weight: 700; font-size: 17px; line-height: 1.1; }
  .num small { display: block; font-size: 10px; font-weight: 600; color: var(--muted); margin-top: 2px; }
  .num.taken { background: var(--soft); }
  .num.sel { border-color: var(--pri); background: var(--pri); color: #fff; }
  .num.sel small { color: #dbe6ff; }
  .num:disabled { opacity: .35; cursor: default; }
  .seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
  .seg button { border: none; background: #fff; padding: 10px 26px; font-weight: 700; cursor: pointer; font-size: 16px; }
  .seg button.on { background: var(--pri); color: #fff; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
  .chip { border: 1px solid var(--line); background: var(--soft); border-radius: 999px; padding: 4px 12px; font-size: 13.5px; font-weight: 700; cursor: pointer; }
  .money-in { display: flex; gap: 8px; align-items: center; }
  .money-in input { max-width: 150px; font-size: 20px; font-weight: 700; text-align: right; }

  /* 배치도 */
  .board { text-align: center; font-size: 12.5px; color: var(--muted); border: 1.5px dashed #cfd5e1; border-radius: 10px; padding: 5px; margin-top: 12px; letter-spacing: .3em; }
  .board.top { margin-top: 0; margin-bottom: 12px; }
  .badge-cls { display: inline-block; background: #2563eb; color: #fff; border-radius: 8px; padding: 2px 10px; font-size: 18px; margin-right: 6px; vertical-align: middle; }
  .map { display: grid; gap: 12px; }
  .unit { border: 1px solid var(--line); border-radius: 12px; padding: 7px; background: var(--soft); }
  .unit .ut { font-size: 11.5px; color: var(--muted); margin: 0 2px 5px; font-weight: 600; }
  .seats { display: grid; gap: 6px; }
  .seat { position: relative; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; min-height: 60px; padding: 6px 4px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; user-select: none; }
  .seat .sid { font-weight: 800; font-size: 17px; letter-spacing: .02em; }
  .seat .nm { font-size: 13px; font-weight: 600; }
  .seat .sub { font-size: 10.5px; color: var(--muted); }
  .seat.M { background: var(--m); border-color: var(--m-line); }
  .seat.F { background: var(--f); border-color: var(--f-line); }
  .seat.off { background: var(--off); border-style: dashed; color: #9aa2b1; cursor: default; }
  .seat.dis { opacity: .38; cursor: default; }
  .seat.c1 { border: 3px solid var(--c1); background: #eef4ff; }
  .seat.c2 { border: 3px solid var(--c2); background: #e9faf6; }
  .seat .badge { position: absolute; top: -8px; right: -6px; border-radius: 999px; font-size: 11px; font-weight: 800; color: #fff; padding: 1px 7px; }
  .seat.c1 .badge { background: var(--c1); } .seat.c2 .badge { background: var(--c2); }
  .seat.me { border: 3px solid #e0a800; background: #fff6d6; box-shadow: 0 0 0 4px rgba(255,213,74,.45); }
  .seat.sel { outline: 3px solid var(--pri); outline-offset: 2px; }
  .seat.gM { box-shadow: inset 0 -5px 0 var(--m-line); } .seat.gF { box-shadow: inset 0 -5px 0 var(--f-line); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 10px; }
  .legend i { display: inline-block; width: 13px; height: 13px; border-radius: 4px; vertical-align: -2px; margin-right: 4px; border: 1.5px solid; }

  /* 신청 카드 */
  .pick { border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; background: #fff; cursor: pointer; }
  .pick.on { border-color: var(--pri); box-shadow: 0 0 0 3px var(--pri-soft); }
  .pick.c2.on { border-color: var(--c2); box-shadow: 0 0 0 3px #d6f5ef; }
  .pick .ph { display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
  .pick .pv { font-size: 24px; font-weight: 800; margin: 4px 0; min-height: 34px; }
  .pick .pv.none { font-size: 14px; color: var(--muted); font-weight: 600; padding-top: 8px; }
  .step { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .step button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--soft); font-size: 18px; font-weight: 800; cursor: pointer; }
  .step .val { min-width: 64px; text-align: center; font-size: 20px; font-weight: 800; }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
  @media (max-width: 820px) { .picks { grid-template-columns: 1fr; } }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.97); border-top: 1px solid var(--line); z-index: 20; }
  .bar .in { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .bar .st { font-size: 12px; color: var(--muted); } .bar .st b { display: block; font-size: 20px; color: var(--ink); }
  .bar .st.over b { color: var(--bad); }
  .bar .sp { flex: 1; }

  /* 결과 */
  .big-seat { font-size: 64px; font-weight: 900; letter-spacing: .03em; color: var(--pri-ink); line-height: 1.1; }
  .done { font-size: 44px; }

  /* 표 */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: middle; }
  th { color: var(--muted); font-weight: 700; font-size: 12.5px; background: var(--soft); position: sticky; top: 0; }
  td input, td select { padding: 6px 8px; border-radius: 8px; }
  tr.dup td { background: var(--bad-soft); }
  .scroll { overflow: auto; max-height: 560px; border: 1px solid var(--line); border-radius: 10px; }

  /* 관리자 */
  .steps { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
  .steps span { padding: 6px 12px; border-radius: 999px; background: var(--off); color: var(--muted); font-size: 13px; font-weight: 700; }
  .steps span.done { background: var(--ok-soft); color: var(--ok); }
  .steps span.now { background: var(--pri); color: #fff; }
  .tabs { display: flex; gap: 4px; border-bottom: 1.5px solid var(--line); margin-bottom: 14px; flex-wrap: wrap; }
  .tabs button { border: none; background: none; padding: 10px 14px; font-weight: 700; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1.5px; }
  .tabs button.on { color: var(--pri-ink); border-bottom-color: var(--pri); }
  .teacher-only { border: 2px dashed #e7a13a; background: #fffaf0; }
  .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .kv div { background: var(--soft); border-radius: 10px; padding: 8px 12px; } .kv b { display: block; font-size: 20px; }
  .subm { display: flex; flex-wrap: wrap; gap: 6px; }
  .subm span { padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--off); color: var(--muted); }
  .subm span.y { background: var(--ok-soft); color: var(--ok); }
  .units-ed { display: flex; flex-wrap: wrap; gap: 6px; }
  .units-ed .u { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 10px; padding: 4px 6px; background: #fff; font-size: 13px; }
  .units-ed .u button { border: none; background: var(--soft); border-radius: 6px; width: 24px; height: 24px; cursor: pointer; font-weight: 800; }
  .via { font-size: 10px; font-weight: 700; padding: 0 6px; border-radius: 999px; background: #fff; border: 1px solid var(--line); color: var(--muted); }

  /* 전광판 */
  .tv { position: fixed; inset: 0; background: #fff; z-index: 100; overflow: auto; padding: 22px 28px; }
  .tv h1 { text-align: center; font-size: 34px; margin: 0 0 14px; }
  .tv .seat { min-height: 88px; } .tv .seat .sid { font-size: 15px; color: var(--muted); } .tv .seat .nm { font-size: 26px; font-weight: 800; }
  .tv .close { position: fixed; top: 12px; right: 16px; }

  /* 모달 · 토스트 */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,20,35,.45); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: #fff; border-radius: 16px; max-width: 460px; width: 100%; padding: 20px 22px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .modal h3 { margin: 0 0 10px; font-size: 18px; }
  .modal .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: 300; padding: 11px 18px; border-radius: 12px; font-weight: 700; box-shadow: var(--shadow); max-width: 90vw; }
  .toast.ok { background: #16924a; color: #fff; } .toast.bad { background: #c62828; color: #fff; } .toast.info { background: #1c2230; color: #fff; }
  .spin { display: inline-block; width: 16px; height: 16px; border: 2.5px solid #c9d3e6; border-top-color: var(--pri); border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: -3px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .loading { text-align: center; padding: 40px; color: var(--muted); }

  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { position: absolute; left: 0; top: 0; width: 100%; }
    .noprint { display: none !important; }
  }
</style>

<script>
/**
 * =============================================================================
 * 5학년 공용 자리바꾸기 — 배정 엔진 v4 (SeatEngine)
 * -----------------------------------------------------------------------------
 * - 순수 JavaScript: Google Apps Script(V8) · 브라우저 · Node.js 어디서나 동작
 * - 우선권 없음. "가원 투자(확률권) + 랜덤"만 사용
 * - 가원은 확률만 높여줌. 어떤 경우에도 100% 확정 불가 (랜덤표 R장이 항상 섞임)
 * - 투자한 가원은 결과와 상관없이 전액 차감 (교사 고정석 학생, 무효 지망만 예외)
 *
 * 배정 순서
 *   0. 교사 고정석
 *   1. 1지망 추첨   : 자리마다 [지원자 추첨권 + 랜덤표 R장] 중 1장 뽑기
 *   2. 2지망 추첨   : 1지망에서 떨어진 학생 대상, 같은 방식
 *   3. 친구 추첨    : 친구가 앉은 짝/모둠에 빈자리가 있으면 [추첨권 vs 랜덤표]
 *   4. 랜덤 배치    : 나머지 학생 무작위
 *   (전 과정에서 성별 규칙 · 떨어뜨리기 쌍을 지킴)
 *
 * 추첨권 = 1장(지원 기본) + 투자 가원 1가원당 1장 (항목당 상한 maxBid)
 * =============================================================================
 */
(function (root) {
  'use strict';

  var DEFAULTS = {
    randomTickets: 10,   // 랜덤표 R: 클수록 운 요소 ↑ (최소 1)
    maxBid: 20,          // 항목(1지망/2지망/친구)당 투자 상한
    patternSamples: 200, // 성별 구성 후보 샘플 수
    randomRetries: 60    // 떨어뜨리기 쌍 때문에 막힐 때 재시도 횟수
  };

  var LETTERS = 'ABCDEFGHIJ';

  // ---------------------------------------------------------------------------
  // 난수 (시드 고정 → 같은 시드면 같은 결과, 감사·재현용)
  // ---------------------------------------------------------------------------
  function makeRng(seed) {
    // 시드를 한 번 섞어서(연속된 시드끼리도 결과가 비슷해지지 않도록)
    var h = (Number(seed) >>> 0) || 1;
    h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
    var a = (h >>> 0) || 1;
    for (var w = 0; w < 4; w++) { a = (a + 0x6D2B79F5) | 0; }
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function newSeed() { return (Math.floor(Math.random() * 4294967295) >>> 0) || 1; }
  function shuffle(arr, rng) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pick(arr, rng) { return arr[Math.floor(rng() * arr.length)]; }
  function toInt(v) { var n = parseInt(v, 10); return isNaN(n) || n < 0 ? 0 : n; }

  // ---------------------------------------------------------------------------
  // 배치 틀
  // ---------------------------------------------------------------------------
  function fill(n, v) { var a = []; for (var i = 0; i < n; i++) a.push(v); return a; }

  var PRESETS = {
    group4x6:      { name: '4인 모둠 × 6 (24석)',              units: fill(6, 4), perRow: 3 },
    group4x5_5x1:  { name: '4인 모둠 × 5 + 5인 모둠 × 1 (25석)', units: fill(5, 4).concat([5]), perRow: 3 },
    group5x5:      { name: '5인 모둠 × 5 (25석)',              units: fill(5, 5), perRow: 3 },
    group6x4:      { name: '6인 모둠 × 4 (24석)',              units: fill(4, 6), perRow: 2 },
    pair12:        { name: '짝 × 12 (24석)',                   units: fill(12, 2), perRow: 3 },
    pair12_single1:{ name: '짝 × 12 + 혼자 자리 1 (25석)',       units: fill(12, 2).concat([1]), perRow: 3 },
    pair13:        { name: '짝 × 13 (26석)',                   units: fill(13, 2), perRow: 3 },
    single25:      { name: '혼자 자리 × 25 (25석)',             units: fill(25, 1), perRow: 5 }
  };

  /**
   * spec = { units:[4,4,4,4,4,5], perRow:3, disabled:['6E'], labels:{'1':'창가 앞'} }
   * 좌석 이름 = 묶음번호 + 알파벳 (예: 3B = 3번 묶음의 B자리)
   */
  function buildLayout(spec) {
    var units = [], seats = {}, perRow = spec.perRow || 3;
    var disabled = {};
    (spec.disabled || []).forEach(function (s) { disabled[s] = true; });
    (spec.units || []).forEach(function (size, i) {
      var id = String(i + 1), ids = [];
      for (var k = 0; k < size; k++) {
        var sid = id + LETTERS[k];
        ids.push(sid);
        seats[sid] = { id: sid, unit: id, idx: k, active: !disabled[sid] };
      }
      var act = ids.filter(function (s) { return seats[s].active; });
      units.push({
        id: id, no: i + 1, size: size, seats: ids, activeSeats: act,
        type: act.length <= 1 ? 'single' : (act.length === 2 ? 'pair' : 'group'),
        label: (spec.labels && spec.labels[id]) || '',
        row: Math.floor(i / perRow), col: i % perRow
      });
    });
    var activeCount = Object.keys(seats).filter(function (s) { return seats[s].active; }).length;
    return { units: units, seats: seats, perRow: perRow, activeCount: activeCount, spec: spec };
  }

  // ---------------------------------------------------------------------------
  // 입력 정리 · 검증
  // ---------------------------------------------------------------------------
  /**
   * input = {
   *   layout,                         // buildLayout 결과
   *   config: { genderMode:'auto'|'seat', pairRule:'mixed'|'same'|'free',
   *             groupRule:'balance'|'free', seatGender:{'1A':'M'}, randomTickets, maxBid },
   *   students: [{ no, name, gender:'M'|'F', money }],
   *   apps: { [no]: { c1:{seat,amount}, c2:{seat,amount}, friend:{no,amount} } },
   *   teacher: { fixed:{ [no]: seatId }, separate:[[no,no], ...] },
   *   seed
   * }
   */
  function prepare(input) {
    var L = input.layout;
    var cfg = {};
    Object.keys(DEFAULTS).forEach(function (k) { cfg[k] = DEFAULTS[k]; });
    Object.keys(input.config || {}).forEach(function (k) { cfg[k] = input.config[k]; });
    cfg.randomTickets = Math.max(1, toInt(cfg.randomTickets) || DEFAULTS.randomTickets);
    cfg.maxBid = Math.max(0, toInt(cfg.maxBid));
    cfg.genderMode = cfg.genderMode === 'seat' ? 'seat' : 'auto';
    cfg.pairRule = ['mixed', 'same'].indexOf(cfg.pairRule) >= 0 ? cfg.pairRule : 'free';
    cfg.groupRule = cfg.groupRule === 'balance' ? 'balance' : 'free';
    cfg.seatGender = cfg.seatGender || {};

    var warnings = [];
    var students = (input.students || []).map(function (s) {
      return { no: String(s.no), name: String(s.name || ''), gender: s.gender === 'F' ? 'F' : 'M', money: toInt(s.money) };
    });
    var byNo = {};
    students.forEach(function (s) { byNo[s.no] = s; });

    var teacher = input.teacher || {};
    var fixed = {}, reserved = {};
    Object.keys(teacher.fixed || {}).forEach(function (no) {
      var seat = teacher.fixed[no];
      if (!byNo[no]) return;
      if (!L.seats[seat] || !L.seats[seat].active) { warnings.push('고정석 무시: ' + no + '번 → ' + seat + ' (없는 자리)'); return; }
      if (reserved[seat]) { warnings.push('고정석 중복: ' + seat); return; }
      fixed[no] = seat; reserved[seat] = no;
    });
    var sepPartners = {};
    (teacher.separate || []).forEach(function (p) {
      var a = String(p[0]), b = String(p[1]);
      if (!byNo[a] || !byNo[b] || a === b) return;
      (sepPartners[a] = sepPartners[a] || []).push(b);
      (sepPartners[b] = sepPartners[b] || []).push(a);
    });

    // 지망 · 친구 정리 (무효는 차감 없음)
    var apps = {};
    students.forEach(function (s) {
      var raw = (input.apps || {})[s.no] || {};
      var a = { c1: null, c2: null, friend: null, invalid: [] };
      if (fixed[s.no]) { a.fixedIgnored = !!(raw.c1 || raw.c2 || raw.friend); apps[s.no] = a; return; }
      function seatOk(c, label) {
        if (!c || !c.seat) return null;
        var seat = String(c.seat), amt = Math.min(toInt(c.amount), cfg.maxBid);
        var st = L.seats[seat];
        if (!st || !st.active) { a.invalid.push(label + ': 없는 자리 ' + seat); return null; }
        if (reserved[seat]) { a.invalid.push(label + ': 교사 지정 자리 ' + seat); return null; }
        if (cfg.genderMode === 'seat' && cfg.seatGender[seat] && cfg.seatGender[seat] !== s.gender) {
          a.invalid.push(label + ': 성별이 맞지 않는 자리 ' + seat); return null;
        }
        return { seat: seat, amount: amt };
      }
      a.c1 = seatOk(raw.c1, '1지망');
      a.c2 = seatOk(raw.c2, '2지망');
      if (a.c2 && a.c1 && a.c2.seat === a.c1.seat) { a.invalid.push('2지망이 1지망과 같음'); a.c2 = null; }
      if (a.c2 && !a.c1) { a.c1 = a.c2; a.c2 = null; }
      if (raw.friend && raw.friend.no != null && String(raw.friend.no) !== '') {
        var fno = String(raw.friend.no);
        if (!byNo[fno] || fno === s.no) a.invalid.push('친구 번호 오류');
        else a.friend = { no: fno, amount: Math.min(toInt(raw.friend.amount), cfg.maxBid) };
      }
      // 보유 가원 초과 시: 입력 순서(1지망→2지망→친구) 기준으로 넘치는 만큼 깎음
      var budget = s.money;
      ['c1', 'c2', 'friend'].forEach(function (k) {
        if (!a[k]) return;
        if (a[k].amount > budget) { a.invalid.push(k + ' 투자액이 보유 가원 초과 → ' + budget + '가원으로 조정'); a[k].amount = budget; }
        budget -= a[k].amount;
      });
      apps[s.no] = a;
    });

    var M = students.filter(function (s) { return s.gender === 'M'; }).length;
    var F = students.length - M;
    if (L.activeCount < students.length) {
      throw new Error('자리(' + L.activeCount + '석)가 학생 수(' + students.length + '명)보다 적습니다.');
    }
    if (cfg.genderMode === 'seat') {
      var sm = 0, sf = 0, sa = 0;
      Object.keys(L.seats).forEach(function (sid) {
        if (!L.seats[sid].active) return;
        var g = cfg.seatGender[sid];
        if (g === 'M') sm++; else if (g === 'F') sf++; else sa++;
      });
      if (Math.max(0, M - sm) + Math.max(0, F - sf) > sa) {
        throw new Error('좌석별 성별 지정이 학생 수와 맞지 않습니다. (남 ' + M + '명/남자석 ' + sm + ', 여 ' + F + '명/여자석 ' + sf + ', 공용석 ' + sa + ')');
      }
    }
    return { L: L, cfg: cfg, students: students, byNo: byNo, fixed: fixed, reserved: reserved,
             sepPartners: sepPartners, apps: apps, M: M, F: F, warnings: warnings };
  }

  // ---------------------------------------------------------------------------
  // 성별 구성(패턴) — "묶음별 남/여 인원"만 정하고, 어느 자리에 앉을지는 추첨으로
  // ---------------------------------------------------------------------------
  function samplePattern(ctx, rng) {
    var L = ctx.L, cfg = ctx.cfg, M = ctx.M, F = ctx.F, N = M + F;
    var gov = {}; // unitId -> {M,F}
    var groups = [], pairs = [], freeCap = 0;
    L.units.forEach(function (u) {
      if (!u.activeSeats.length) return;
      if (u.type === 'group' && cfg.groupRule === 'balance') groups.push(u);
      else if (u.type === 'pair' && cfg.pairRule !== 'free') pairs.push(u);
      else freeCap += u.activeSeats.length;
    });
    var capG = groups.reduce(function (s, u) { return s + u.activeSeats.length; }, 0);
    var Mv = M, Fv = F;
    // 공용 묶음(규칙 없는 묶음)에 고정된 학생은 먼저 빼 둠
    var govIds = {};
    groups.concat(pairs).forEach(function (u) { govIds[u.id] = true; });
    var fixA = { M: 0, F: 0 };
    for (var fno in ctx.fixed) {
      if (!govIds[L.seats[ctx.fixed[fno]].unit]) fixA[ctx.byNo[fno].gender]++;
    }
    Mv -= fixA.M; Fv -= fixA.F; freeCap -= (fixA.M + fixA.F); N = Mv + Fv;

    // (1) 모둠 성비 밸런스
    if (groups.length) {
      var nG = Math.min(capG, N);
      // 빈자리는 큰 모둠부터
      var sizes = {};
      groups.forEach(function (u) { sizes[u.id] = u.activeSeats.length; });
      var empt = capG - nG;
      while (empt > 0) {
        var maxS = Math.max.apply(null, groups.map(function (u) { return sizes[u.id]; }));
        var cands = groups.filter(function (u) { return sizes[u.id] === maxS; });
        sizes[pick(cands, rng).id]--; empt--;
      }
      var exact = N ? nG * Mv / N : 0;
      var MG = Math.floor(exact) + (rng() < exact - Math.floor(exact) ? 1 : 0);
      MG = Math.max(Math.max(0, nG - Fv), Math.min(Mv, nG, MG));
      // 최대 나머지 방식으로 모둠별 남학생 수
      var alloc = groups.map(function (u) {
        var e = nG ? sizes[u.id] * MG / nG : 0;
        return { u: u, m: Math.floor(e), rem: e - Math.floor(e) + rng() * 1e-6 };
      });
      var left = MG - alloc.reduce(function (s, x) { return s + x.m; }, 0);
      alloc.sort(function (a, b) { return b.rem - a.rem; });
      for (var i = 0; i < alloc.length && left > 0; i++) {
        if (alloc[i].m < sizes[alloc[i].u.id]) { alloc[i].m++; left--; }
      }
      alloc.forEach(function (x) {
        gov[x.u.id] = { M: x.m, F: sizes[x.u.id] - x.m };
      });
      Mv -= MG; Fv -= (nG - MG);
    }

    // (2) 짝 규칙 (이성 짝 / 동성 짝)
    if (pairs.length) {
      var P = shuffle(pairs, rng), idx = 0;
      var take = function (m, f) { gov[P[idx].id] = { M: m, F: f }; idx++; };
      if (cfg.pairRule === 'mixed') {
        var x = Math.min(Mv, Fv, P.length);
        for (var k = 0; k < x; k++) take(1, 1);
        Mv -= x; Fv -= x;
        while (idx < P.length) {
          if (Mv >= 2) { take(2, 0); Mv -= 2; }
          else if (Fv >= 2) { take(0, 2); Fv -= 2; }
          else break;
        }
      } else { // same
        var a = Math.floor(Mv / 2), b = Math.floor(Fv / 2);
        while (a + b > P.length) { if (a >= b) a--; else b--; }
        var order = shuffle(fill(a, 'MM').concat(fill(b, 'FF')), rng);
        order.forEach(function (t) { if (t === 'MM') take(2, 0); else take(0, 2); });
        Mv -= 2 * a; Fv -= 2 * b;
        // 홀수로 남은 1명씩 → 혼자 자리(공용석)가 부족하면 이성 짝 1개
        if (Mv >= 1 && Fv >= 1 && Mv + Fv > freeCap && idx < P.length) { take(1, 1); Mv--; Fv--; }
      }
      // 남은 인원이 공용석보다 많으면 남은 짝에 1명씩(+빈자리)
      while (Mv + Fv > freeCap && idx < P.length) {
        if (Mv >= Fv && Mv > 0) { take(1, 0); Mv--; } else if (Fv > 0) { take(0, 1); Fv--; } else break;
      }
      while (idx < P.length) take(0, 0); // 완전히 빈 짝
    }

    if (Mv < 0 || Fv < 0 || Mv + Fv > freeCap) return null;
    var pat = { gov: gov, quotaA: { M: Mv + fixA.M, F: Fv + fixA.F } };

    // 고정석 학생이 들어갈 수 있는지 확인
    var need = {};
    for (var no in ctx.fixed) {
      var seat = ctx.fixed[no], uid = L.seats[seat].unit, g = ctx.byNo[no].gender;
      var key = gov[uid] ? uid : '_A';
      need[key] = need[key] || { M: 0, F: 0 };
      need[key][g]++;
    }
    for (var key2 in need) {
      var q = key2 === '_A' ? pat.quotaA : gov[key2];
      if (q.M < need[key2].M || q.F < need[key2].F) return null;
    }
    return pat;
  }

  function scorePattern(ctx, pat) {
    var L = ctx.L, score = 0;
    ctx.students.forEach(function (s) {
      var a = ctx.apps[s.no];
      [['c1', 1], ['c2', 0.5]].forEach(function (kw) {
        var c = a[kw[0]];
        if (!c) return;
        var uid = L.seats[c.seat].unit;
        var q = pat.gov[uid] || pat.quotaA;
        if (q[s.gender] > 0) score += kw[1];
      });
    });
    return score;
  }

  function choosePattern(ctx, rng) {
    if (ctx.cfg.genderMode === 'seat') return { mode: 'seat' };
    var hasRule = ctx.L.units.some(function (u) {
      return (u.type === 'group' && ctx.cfg.groupRule === 'balance') || (u.type === 'pair' && ctx.cfg.pairRule !== 'free');
    });
    if (!hasRule) return { mode: 'free', gov: {}, quotaA: { M: ctx.M, F: ctx.F } };
    var best = null, bestScore = -1;
    for (var i = 0; i < ctx.cfg.patternSamples; i++) {
      var p = samplePattern(ctx, rng);
      if (!p) continue;
      var sc = scorePattern(ctx, p);
      if (sc > bestScore) { best = p; bestScore = sc; }
    }
    if (!best) {
      ctx.warnings.push('성별 규칙을 고정석과 함께 만족할 수 없어 이번 배치는 성별 자유로 진행했습니다.');
      return { mode: 'free', gov: {}, quotaA: { M: ctx.M, F: ctx.F } };
    }
    best.mode = 'auto';
    return best;
  }

  // ---------------------------------------------------------------------------
  // 배치 상태
  // ---------------------------------------------------------------------------
  function State(ctx, pattern) {
    this.ctx = ctx; this.pattern = pattern;
    this.seatOcc = {}; this.stuSeat = {}; this.via = {};
    this.unitRem = {};
    for (var uid in (pattern.gov || {})) this.unitRem[uid] = { M: pattern.gov[uid].M, F: pattern.gov[uid].F };
    this.quotaA = pattern.quotaA ? { M: pattern.quotaA.M, F: pattern.quotaA.F } : null;
    // 좌석 지정 모드 카운터
    if (pattern.mode === 'seat') {
      var sg = ctx.cfg.seatGender, cnt = { M: 0, F: 0, A: 0 };
      Object.keys(ctx.L.seats).forEach(function (sid) {
        if (!ctx.L.seats[sid].active) return;
        cnt[sg[sid] === 'M' ? 'M' : (sg[sid] === 'F' ? 'F' : 'A')]++;
      });
      this.seatCnt = cnt;
      this.rem = { M: ctx.M, F: ctx.F };
    }
  }
  State.prototype.clone = function () {
    var s = Object.create(State.prototype);
    s.ctx = this.ctx; s.pattern = this.pattern;
    s.seatOcc = Object.assign({}, this.seatOcc);
    s.stuSeat = Object.assign({}, this.stuSeat);
    s.via = Object.assign({}, this.via);
    s.unitRem = {};
    for (var u in this.unitRem) s.unitRem[u] = { M: this.unitRem[u].M, F: this.unitRem[u].F };
    s.quotaA = this.quotaA ? { M: this.quotaA.M, F: this.quotaA.F } : null;
    if (this.seatCnt) { s.seatCnt = Object.assign({}, this.seatCnt); s.rem = Object.assign({}, this.rem); }
    return s;
  };
  State.prototype.eligible = function (no, seat, ignoreSep) {
    var ctx = this.ctx, st = ctx.L.seats[seat];
    if (!st || !st.active || this.seatOcc[seat]) return false;
    if (ctx.reserved[seat] && ctx.reserved[seat] !== no) return false;
    var g = ctx.byNo[no].gender, uid = st.unit, self = this;
    if (!ignoreSep) {
      var sp = ctx.sepPartners[no] || [];
      for (var i = 0; i < sp.length; i++) {
        var ps = self.stuSeat[sp[i]];
        if (ps && ctx.L.seats[ps].unit === uid) return false;
      }
    }
    var mode = this.pattern.mode;
    if (mode === 'seat') {
      var sg = ctx.cfg.seatGender[seat] || 'A';
      if (sg !== 'A' && sg !== g) return false;
      // 가상 배치 후에도 나머지 학생이 앉을 수 있는지
      var c = { M: this.seatCnt.M, F: this.seatCnt.F, A: this.seatCnt.A };
      c[sg]--;
      var r = { M: this.rem.M, F: this.rem.F }; r[g]--;
      return Math.max(0, r.M - c.M) + Math.max(0, r.F - c.F) <= c.A;
    }
    var q = this.unitRem[uid] || this.quotaA;
    return q[g] > 0;
  };
  State.prototype.place = function (no, seat, via) {
    var ctx = this.ctx, g = ctx.byNo[no].gender, uid = ctx.L.seats[seat].unit;
    this.seatOcc[seat] = no; this.stuSeat[no] = seat; this.via[no] = via;
    if (this.pattern.mode === 'seat') {
      var sg = ctx.cfg.seatGender[seat] || 'A';
      this.seatCnt[sg]--; this.rem[g]--;
    } else {
      var q = this.unitRem[uid] || this.quotaA;
      q[g]--;
    }
  };
  State.prototype.emptySeats = function () {
    var self = this, L = this.ctx.L;
    return Object.keys(L.seats).filter(function (s) { return L.seats[s].active && !self.seatOcc[s]; });
  };

  // ---------------------------------------------------------------------------
  // 추첨 한 번: [지원자 추첨권들 + 랜덤표 R장] 중 1장
  // ---------------------------------------------------------------------------
  function lottery(entries, R, rng) {
    // entries: [{no, tickets}] → 당첨 no 또는 null(랜덤표)
    var total = R;
    entries.forEach(function (e) { total += e.tickets; });
    var r = rng() * total;
    for (var i = 0; i < entries.length; i++) {
      r -= entries[i].tickets;
      if (r < 0) return entries[i].no;
    }
    return null;
  }

  // ---------------------------------------------------------------------------
  // 메인: 자리 뽑기
  // ---------------------------------------------------------------------------
  function runDraw(input) {
    var seed = input.seed != null ? (Number(input.seed) >>> 0) || 1 : newSeed();
    var rng = makeRng(seed);
    var ctx = prepare(input);
    var L = ctx.L, cfg = ctx.cfg, R = cfg.randomTickets;
    var pattern = choosePattern(ctx, rng);
    var S = new State(ctx, pattern);
    var log = [];

    // 0. 교사 고정석
    Object.keys(ctx.fixed).forEach(function (no) {
      var seat = ctx.fixed[no];
      if (S.eligible(no, seat, true)) S.place(no, seat, 'fixed');
      else {
        S.seatOcc[seat] = no; S.stuSeat[no] = seat; S.via[no] = 'fixed';
        if (S.pattern.mode === 'seat') {
          S.seatCnt[ctx.cfg.seatGender[seat] || 'A']--; S.rem[ctx.byNo[no].gender]--;
        }
        ctx.warnings.push(no + '번 고정석(' + seat + ')이 성별 규칙과 맞지 않지만 교사 지정대로 앉혔습니다.');
      }
    });

    // 1·2. 지망 추첨
    ['c1', 'c2'].forEach(function (key) {
      var bySeat = {};
      ctx.students.forEach(function (s) {
        var c = ctx.apps[s.no][key];
        if (c && !S.stuSeat[s.no]) (bySeat[c.seat] = bySeat[c.seat] || []).push({ no: s.no, tickets: 1 + c.amount });
      });
      shuffle(Object.keys(bySeat), rng).forEach(function (seat) {
        var entries = bySeat[seat].filter(function (e) { return !S.stuSeat[e.no] && S.eligible(e.no, seat); });
        if (!entries.length || S.seatOcc[seat]) return;
        var win = lottery(entries, R, rng);
        log.push({ round: key === 'c1' ? '1지망' : '2지망', seat: seat,
                   entries: entries.map(function (e) { return e.no + ':' + e.tickets; }).join(', '), random: R, winner: win || '랜덤표' });
        if (win) S.place(win, seat, key);
      });
    });

    // 3·4. 친구 추첨 + 랜덤 배치 (떨어뜨리기 쌍 때문에 막히면 재시도)
    var base = S, done = null, attempt;
    for (attempt = 0; attempt <= cfg.randomRetries; attempt++) {
      var T = base.clone(), ok = true, flog = [];
      // (a) 친구 추첨 — 랜덤 배치 전에 먼저 (빈자리가 가장 많을 때)
      shuffle(ctx.students, rng).forEach(function (s) {
        var A = s.no, fr = ctx.apps[A].friend;
        if (!fr) return;
        var B = fr.no, aIn = !!T.stuSeat[A], bIn = !!T.stuSeat[B];
        if (aIn && bIn) { flog.push({ round: '친구', from: A, to: B, result: '둘 다 이미 자리 있음' }); return; }
        var win = lottery([{ no: A, tickets: 1 + fr.amount }], R, rng);
        var entry = { round: '친구', from: A, to: B, tickets: 1 + fr.amount, random: R, result: win ? '성공' : '랜덤표' };
        flog.push(entry);
        if (!win) return;
        var unitSeats = function (no) { return L.units[Number(L.seats[T.stuSeat[no]].unit) - 1].activeSeats; };
        if (aIn || bIn) {
          // 한 명만 앉아 있음 → 안 앉은 사람을 그 묶음 빈자리로
          var sitter = aIn ? A : B, mover = aIn ? B : A;
          var c = unitSeats(sitter).filter(function (st) { return T.eligible(mover, st); });
          if (c.length) T.place(mover, pick(c, rng), 'friend'); else entry.result = '성공했지만 빈자리 없음';
          return;
        }
        // 둘 다 안 앉음 → 둘이 함께 앉을 수 있는 묶음을 무작위로
        var units = shuffle(L.units.filter(function (u) { return u.activeSeats.length >= 2; }), rng);
        for (var ui = 0; ui < units.length; ui++) {
          var sa = shuffle(units[ui].activeSeats.filter(function (st) { return T.eligible(A, st); }), rng);
          for (var si = 0; si < sa.length; si++) {
            var trial = T.clone();
            trial.place(A, sa[si], 'friend');
            var sb = units[ui].activeSeats.filter(function (st) { return trial.eligible(B, st); });
            if (sb.length) { T.place(A, sa[si], 'friend'); T.place(B, pick(sb, rng), 'friend'); return; }
          }
        }
        entry.result = '성공했지만 함께 앉을 묶음 없음';
      });
      // (b) 남은 학생 무작위 배치
      var queue = shuffle(ctx.students.filter(function (s) { return !T.stuSeat[s.no]; }).map(function (s) { return s.no; }), rng);
      for (var qi = 0; qi < queue.length; qi++) {
        var no = queue[qi];

  // ---------------------------------------------------------------------------

  // 교사 수기 변경 (관리자 창 전용, 학생 미고지) — 두 자리 맞바꾸기/빈자리로 이동

  }

      (editable ? '<button class="btn sm bad" data-act="tDel" data-k="fixed" data-i="' + i + '">✕</button>' : '') + '</div>';
  });
  if (editable) h += '<button class="btn sm" data-act="tAdd" data-k="fixed">+ 고정석 추가</button>';
  h += '<h3>떨어뜨릴 학생 (같은 짝 · 모둠이 되지 않게)</h3>' + (td.separate.length ? '' : '<p class="small muted">없음</p>');
  td.separate.forEach(function (p, i) {
    h += '<div class="row" style="margin-bottom:6px"><select data-tf="separate" data-i="' + i + '" data-f="a" style="width:180px"' + (editable ? '' : ' disabled') + '>' + stuOpt(p.a) + '</select> ↔ <select data-tf="separate" data-i="' + i + '" data-f="b" style="width:180px"' + (editable ? '' : ' disabled') + '>' + stuOpt(p.b) + '</select>' +
      (editable ? '<button class="btn sm bad" data-act="tDel" data-k="separate" data-i="' + i + '">✕</button>' : '') + '</div>';
  });
  if (editable) h += '<button class="btn sm" data-act="tAdd" data-k="separate">+ 쌍 추가</button>';
  // 고정석을 이미 고른 학생 경고
  var saved = r.teacher.fixed || {}, hit = [];
  Object.keys(saved).forEach(function (no) {
    var seat = saved[no];
    d.students.forEach(function (s) { var a = d.apps[s.no]; if (a && s.no !== no && ((a.c1 && a.c1.seat === seat) || (a.c2 && a.c2.seat === seat))) hit.push(s.no + '번(' + seat + ')'); });
  });
  if (hit.length) h += '<div class="notice warn" style="margin-top:10px">고정석으로 막은 자리를 이미 고른 학생: ' + hit.join(', ') + ' — 그 지망은 무효가 되고 가원도 차감되지 않아요.</div>';
  if (editable) h += '<div style="margin-top:14px"><button class="btn pri" data-act="saveTeacher">교사 설정 저장</button></div>';
  h += '</div>';
  if (st === 'apply') h += '<div class="card"><button class="btn big pri" data-act="toClosed">⏹ 신청 마감</button> <span class="small muted">마감하면 학생은 더 이상 고칠 수 없어요.</span></div>';
  if (st === 'closed') h += '<div class="card"><button class="btn" data-act="toApply2">▶ 신청 다시 열기</button> <button class="btn pri" data-act="tab" data-tab="draw">자리 뽑기로 →</button></div>';
  return h;
}

// --- 자리 뽑기 ---
function drawHtml() {
  var d = A.data, r = d.round, st = r.status, res = d.result;
  var h = '';
  if (st === 'register' || st === 'apply') return '<div class="card"><p>먼저 신청을 마감해야 자리를 뽑을 수 있어요.</p>' + (st === 'apply' ? '<button class="btn pri" data-act="toClosed">⏹ 신청 마감</button>' : '') + '</div>';
  if (st === 'closed') return '<div class="card center"><div class="done">🎲</div><h2>자리를 뽑을 준비가 됐어요</h2><p class="muted">뽑은 결과는 [결과 공개]를 누르기 전까지 학생에게 보이지 않아요.</p><button class="btn pri big" data-act="draw">🎲 자리 뽑기</button><p style="margin-top:14px"><button class="btn sm" data-act="toApply2">▶ 신청 다시 열기</button></p></div>';
  var name = {}; res.students.forEach(function (s) { name[s.no] = s; });
  var occ = {}; res.seats.forEach(function (x) { occ[x.seat] = x.no; });
  h += '<div class="card"><div class="row"><h2 style="margin:0">' + (st === 'published' ? '공개된 결과' : '뽑은 결과 (아직 비공개)') + '</h2><span class="sp" style="flex:1"></span>' +
    '<span class="pill gray">' + (res.drawCount || 1) + '번째 뽑기 · 시드 ' + res.seed + (res.manualEdits && res.manualEdits.length ? ' · 수기 변경 ' + res.manualEdits.length + '회' : '') + '</span></div>';
  if (st === 'drawn') h += '<p class="small muted">자리 두 개를 차례로 누르면 서로 바뀌어요 (빈자리로 옮기기도 돼요). 바꾼 내용은 학생에게 알리지 않아요.</p>';
  if (res.warnings && res.warnings.length) h += '<div class="notice warn">' + res.warnings.map(esc).join('<br>') + '</div>';
  h += mapHtml(r.layout, { seat: function (sid, u, st2) {
    if (!st2.active) return null;
    var s = occ[sid] ? name[occ[sid]] : null;
    return { cls: (s ? s.gender : '') + (A.sel === sid ? ' sel' : ''),
      html: '<div class="sid">' + sid + '</div>' + (s ? '<div class="nm">' + s.no + ' ' + esc(s.name) + '</div><span class="via">' + (VIA[s.via] || '') + '</span>' : '<div class="sub">빈자리</div>') };
  } });
  h += '<div class="legend"><span>작은 표시 = 배정 경로(교사만): 1지망 · 2지망 · 친구 · 랜덤 · 고정 · 수기</span></div></div>';
  if (st === 'drawn') {
    h += '<div class="card"><div class="row"><button class="btn ok big" data-act="publish">📢 결과 공개</button><button class="btn" data-act="redraw">🎲 다시 뽑기</button><button class="btn" data-act="openTv">📺 전광판 미리보기</button><button class="btn" data-act="toApply3">↩ 신청 다시 받기 (결과 삭제)</button></div></div>';
  } else {
    h += '<div class="card"><div class="row"><button class="btn pri" data-act="openTv">📺 전광판</button><button class="btn" data-act="unpublish">공개 취소</button></div></div>';
  }
  return h;
}

// --- 공개 · 징수표 ---
function payHtml() {
  var d = A.data, r = d.round, st = r.status, res = d.result;
  if (!res) return '<div class="card"><p class="muted">자리를 뽑은 뒤에 징수표가 만들어져요.</p></div>';
  var paid = r.paid || {}, total = 0, got = 0;
  var rows = res.students.slice().sort(function (a, b) { return int(a.no) - int(b.no); }).map(function (s) {
    total += s.charge; if (paid[s.no]) got += s.charge;
    var br = [s.c1 ? '1지망 ' + s.c1.amount : '', s.c2 ? '2지망 ' + s.c2.amount : '', s.friend ? '친구 ' + s.friend.amount : ''].filter(Boolean).join(' + ');
    return '<tr><td><b>' + s.no + '</b></td><td>' + esc(s.name) + '</td><td>' + esc(s.seat) + '</td><td class="small muted">' + (s.via === 'fixed' ? '교사 고정 (차감 없음)' : br || '-') + '</td><td><b>' + s.charge + '</b></td><td>' + s.money + ' → ' + s.remain + '</td>' +
      '<td class="noprint"><label><input type="checkbox" data-act="paid" data-no="' + s.no + '"' + (paid[s.no] ? ' checked' : '') + (s.charge ? '' : ' disabled') + '> 받음</label></td></tr>';
  }).join('');
  var h = '<div class="card noprint"><div class="row">' + (st === 'published' ? '<span class="pill ok">결과 공개 중</span>' : '<span class="pill warn">아직 비공개</span> <button class="btn ok" data-act="publish">📢 결과 공개</button>') +
    '<button class="btn pri" data-act="openTv">📺 전광판 열기</button><button class="btn" data-act="print">🖨 징수표 인쇄</button></div></div>';
  h += '<div class="card" id="printArea"><h2>' + GRADE + '학년 ' + r.cls + '반 ' + esc(r.month) + ' 자리바꾸기 — 가원 징수표</h2><p class="small">넣은 가원은 결과와 상관없이 모두 걷어요. 받은 금액 <b>' + got + '</b> / 걷을 금액 <b>' + total + '</b>가원</p>' +
    '<table><tr><th>번호</th><th>이름</th><th>자리</th><th>넣은 내역</th><th>낼 가원</th><th>가진 → 남는</th><th class="noprint">받음</th></tr>' + rows + '</table></div>';
  return h;
}

function tvHtml() {
  var d = A.data, r = d.round, res = d.result;
  if (!res) return '';
  var name = {}; res.students.forEach(function (s) { name[s.no] = s.name; });
  var occ = {}; res.seats.forEach(function (x) { occ[x.seat] = x.no; });
  return '<div class="tv"><button class="btn close" data-act="closeTv">닫기 ✕</button>' +
    (r.status !== 'published' ? '<div class="notice warn center" style="max-width:520px;margin:0 auto 10px">미리보기 — 아직 학생에게 공개되지 않았어요</div>' : '') +
    '<h1>' + GRADE + '학년 ' + r.cls + '반 ' + esc(r.month) + ' 자리</h1>' +
    mapHtml(r.layout, { seat: function (sid, u, st2) {
      if (!st2.active) return null;
      var no = occ[sid];
      return { html: '<div class="sid">' + sid + '</div><div class="nm">' + (no ? esc(name[no]) : '') + '</div>' };
    } }) + '</div>';
}

function adminClick(e) {
  var t = e.target.closest('[data-act],[data-seat]');
  if (!t) return;
  var act = t.dataset.act;
  if (!act && t.dataset.seat) return adminSeat(t.dataset.seat);
  switch (act) {
    case 'login': A.pw = (document.getElementById('pw') || {}).value || ''; return loadOverview();
    case 'logout': ss('seat4:pw', null); A.pw = null; stopAdminPoll(); A.view = 'login'; return render();
    case 'refreshHome': return loadOverview();
    case 'home': stopAdminPoll(); A.view = 'home'; return render();
    case 'openCls': A.cls = int(t.dataset.cls); A.view = 'class'; return render();
    case 'backCls': stopAdminPoll(); A.view = 'loading'; render(); return api('adminOverview', A.pw).then(function (r) { A.ov = r; A.cls = A.data.round.cls; A.view = 'class'; render(); });
    case 'createRound': return createRound(t);
    case 'openRound': return openRound(t.dataset.rid);
    case 'reloadRound': return openRound(A.rid, true);
    case 'tab': A.tab = t.dataset.tab; A.sel = null; A.editRow = null; return render();
    case 'uSize': A.draft.layout.units[int(t.dataset.i)] = Math.max(1, Math.min(8, A.draft.layout.units[int(t.dataset.i)] + int(t.dataset.d))); cleanDisabled(); return render();
    case 'uDel': if (A.draft.layout.units.length > 1) A.draft.layout.units.splice(int(t.dataset.i), 1); cleanDisabled(); return render();
    case 'uAdd': A.draft.layout.units.push(int(t.dataset.n)); return render();
    case 'saveSetup': return mutate('adminSaveSetup', [A.draft.layout, A.draft.config], t);
    case 'copyLink': return copyLink();
    case 'rowEdit': A.editRow = t.dataset.no; return render();
    case 'rowNew': A.editRow = '__new'; return render();
    case 'rowCancel': A.editRow = null; return render();
    case 'rowSave': return saveRow(t);
    case 'rowDel': return modal('삭제할까요?', t.dataset.no + '번 학생과 그 학생의 신청서가 지워져요.', '삭제', { danger: true }).then(function (y) { if (y) mutate('adminDeleteStudent', [t.dataset.no], t); });
    case 'chk': A.checked[t.dataset.no] = t.checked; return;
    case 'toApply': return modal('자리 신청을 시작할까요?', '책상 위 가원과 입력한 가원을 확인했나요?<br>시작하면 학생 화면이 자리 신청으로 넘어가요.', '시작').then(function (y) { if (y) mutate('adminSetStatus', ['apply'], t).then(function (r) { if (r) { A.tab = 'apply'; render(); } }); });
    case 'toRegister': return mutate('adminSetStatus', ['register'], t);
    case 'tAdd': saveTeacherInputs(); A.teacherDraft[t.dataset.k].push(t.dataset.k === 'fixed' ? { no: '', seat: '' } : { a: '', b: '' }); return render();
    case 'tDel': saveTeacherInputs(); A.teacherDraft[t.dataset.k].splice(int(t.dataset.i), 1); return render();
    case 'saveTeacher': return saveTeacher(t);
    case 'toClosed': return modal('신청을 마감할까요?', '마감하면 학생은 신청을 고칠 수 없어요.', '마감').then(function (y) { if (y) mutate('adminSetStatus', ['closed'], t).then(function (r) { if (r) { A.tab = 'draw'; render(); } }); });
    case 'toApply2': return mutate('adminSetStatus', ['apply'], t).then(function (r) { if (r) { A.tab = 'apply'; render(); } });
    case 'draw': return mutate('adminDraw', [], t);
    case 'redraw': return modal('다시 뽑을까요?', '지금 결과와 수기 변경이 모두 사라지고 새로 뽑아요. (기록에는 남아요)', '다시 뽑기').then(function (y) { if (y) { A.sel = null; mutate('adminDraw', [], t); } });
    case 'publish': return modal('결과를 공개할까요?', '학생 화면에 자리와 낼 가원이 보여요.', '공개').then(function (y) { if (y) mutate('adminSetStatus', ['published'], t).then(function (r) { if (r) { A.tab = 'pay'; render(); } }); });
    case 'unpublish': return modal('공개를 취소할까요?', '학생 화면에서 결과가 다시 숨겨져요.', '공개 취소', { danger: true }).then(function (y) { if (y) mutate('adminSetStatus', ['drawn'], t); });
    case 'toApply3': return modal('신청을 다시 받을까요?', '뽑은 결과가 지워지고 신청 단계로 돌아가요.', '다시 받기', { danger: true }).then(function (y) { if (y) mutate('adminSetStatus', ['apply'], t).then(function (r) { if (r) { A.tab = 'apply'; render(); } }); });
    case 'openTv': A.tv = true; return render();
    case 'closeTv': A.tv = false; return render();
    case 'print': return window.print();
    case 'paid': return mutate('adminSetPaid', [t.dataset.no, t.checked], null);
    case 'deleteRound': return modal('이 회차를 삭제할까요?', '되돌릴 수 없어요. 계속하려면 <b>삭제</b> 라고 써 주세요.<input type="text" style="margin-top:10px">', '삭제', { danger: true }).then(function (v) {
      if (!v) return; api('adminDeleteRound', A.pw, A.rid, String(v).trim()).then(function (r) { A.ov = r; toast('삭제했어요.', 'ok'); A.view = 'class'; stopAdminPoll(); render(); }).catch(function (e) { toast(e.message, 'bad'); });
    });
  }
}
function cleanDisabled() {
  var L = E.buildLayout(A.draft.layout);
  A.draft.layout.disabled = (A.draft.layout.disabled || []).filter(function (s) { return L.seats[s]; });
  var sg = A.draft.config.seatGender || {};
  Object.keys(sg).forEach(function (s) { if (!L.seats[s]) delete sg[s]; });
}
function adminSeat(sid) {
  if (A.view !== 'round') return;
  if (A.tab === 'setup' && A.data.round.status === 'register') {
    var lay = A.draft.layout, cfg = A.draft.config;
    lay.disabled = lay.disabled || []; cfg.seatGender = cfg.seatGender || {};
    if (A.setupMode === 'gender' && cfg.genderMode === 'seat') {
      var g = cfg.seatGender[sid];
      cfg.seatGender[sid] = g === 'M' ? 'F' : (g === 'F' ? undefined : 'M');
      if (!cfg.seatGender[sid]) delete cfg.seatGender[sid];
    } else {
      var i = lay.disabled.indexOf(sid);
      if (i >= 0) lay.disabled.splice(i, 1); else lay.disabled.push(sid);
    }
    return render();
  }
  if (A.tab === 'draw' && A.data.round.status === 'drawn') {
    if (!A.sel) { A.sel = sid; return render(); }
    if (A.sel === sid) { A.sel = null; return render(); }
    var a = A.sel; A.sel = null;
    return mutate('adminSwap', [a, sid], null);
  }
}
function adminChange(e) {
  var t = e.target;
  if (A.view !== 'round') return;
  var dr = A.draft;
  if (t.id === 'presetSel' && t.value) { var p = E.PRESETS[t.value]; dr.layout = { units: p.units.slice(), perRow: p.perRow, disabled: [], boardPos: dr.layout.boardPos || 'bottom' }; cleanDisabled(); return render(); }
  if (t.id === 'perRow') { dr.layout.perRow = int(t.value, 3); return render(); }
  if (t.id === 'boardPos') { dr.layout.boardPos = t.value; return render(); }
  if (t.id === 'seatMode') { dr.config.genderMode = t.checked ? 'seat' : 'auto'; dr.config.seatGender = dr.config.seatGender || {}; A.setupMode = t.checked ? 'gender' : 'off'; return render(); }
  if (t.id === 'pairRule') { dr.config.pairRule = t.value; return; }
  if (t.id === 'groupRule') { dr.config.groupRule = t.value; return; }
  if (t.id === 'rt') { dr.config.randomTickets = int(t.value, 10); return render(); }
  if (t.id === 'maxBid') { dr.config.maxBid = Math.max(0, Math.min(100, int(t.value, 20))); return render(); }
  if (t.name === 'sm') { A.setupMode = t.value; return; }
  if (t.dataset.tf) { saveTeacherInputs(); return; }
}
function saveTeacherInputs() {
  document.querySelectorAll('[data-tf]').forEach(function (el) {
    var arr = A.teacherDraft[el.dataset.tf], i = int(el.dataset.i);
    if (arr[i]) arr[i][el.dataset.f] = el.value;
  });
}
function saveTeacher(btn) {
  saveTeacherInputs();
  var td = A.teacherDraft, fixed = {}, sep = [];
  var seats = {};
  for (var i = 0; i < td.fixed.length; i++) {
    var f = td.fixed[i]; if (!f.no || !f.seat) continue;
    if (seats[f.seat]) return toast(f.seat + ' 자리에 두 명을 고정할 수 없어요.', 'bad');
    if (fixed[f.no]) return toast(f.no + '번을 두 자리에 고정할 수 없어요.', 'bad');
    seats[f.seat] = 1; fixed[f.no] = f.seat;
  }
  td.separate.forEach(function (p) { if (p.a && p.b && p.a !== p.b) sep.push([p.a, p.b]); });
  return mutate('adminSaveTeacher', [{ fixed: fixed, separate: sep }], btn).then(function (r) { if (r) { A.teacherDraft = teacherToDraft(r.round.teacher); render(); } });
}
function saveRow(btn) {
  var s = { no: document.getElementById('erNo').value, name: document.getElementById('erName').value, gender: document.getElementById('erG').value, money: document.getElementById('erMoney').value };
  var orig = btn.dataset.no;
  mutate('adminUpsertStudent', [s, orig || null], btn).then(function (r) { if (r) { A.editRow = null; render(); } });
}
function createRound(btn) {
  var month = (document.getElementById('newMonth') || {}).value || '';
  var cr = document.getElementById('copyRoster'), cs = document.getElementById('copySep');
  busy(btn, true);
  api('adminCreateRound', A.pw, A.cls, month, { copyRoster: cr ? cr.checked : false, copySeparate: cs ? cs.checked : false }).then(function (r) {
    toast(A.cls + '반 ' + month + ' 자리바꾸기를 만들었어요.', 'ok');
    return api('adminOverview', A.pw).then(function (ov) { A.ov = ov; return openRound(r.roundId); });
  }).catch(function (e) { busy(btn, false); toast(e.message, 'bad'); });
}
function copyLink() {
  var box = document.getElementById('linkBox');
  var done = function () { toast('주소를 복사했어요.', 'ok'); };
  try { navigator.clipboard.writeText(box.value).then(done, function () { box.select(); document.execCommand('copy'); done(); }); }
  catch (err) { box.select(); try { document.execCommand('copy'); done(); } catch (e2) { toast('주소를 직접 선택해서 복사해 주세요.', 'info'); } }
}
function adminKey(e) { if (e.key === 'Enter' && e.target.id === 'pw') { var b = document.querySelector('[data-act=login]'); if (b) b.click(); } }

// ===========================================================================
function render() {
  var y = window.scrollY;
  root.innerHTML = MODE === 'admin' ? renderAdmin() : renderStudent();
  window.scrollTo(0, y);
}
root.addEventListener('click', function (e) { (MODE === 'admin' ? adminClick : studentClick)(e); });
root.addEventListener('change', function (e) { (MODE === 'admin' ? adminChange : studentChange)(e); });
root.addEventListener('keydown', function (e) { (MODE === 'admin' ? adminKey : studentKey)(e); });
if (MODE === 'admin') adminStart(); else studentStart();
})();
</script>
